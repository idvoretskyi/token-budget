name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Portable tests (Swift)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned test environment
        run: docker build --pull --tag token-budget-ci .github/ci
      - name: Test portable targets (UI excluded by manifest)
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            token-budget-ci bash -lc \
            'swift --version && pkg-config --modversion sqlite3 && uname -sm && swift test --scratch-path /tmp/token-budget-build'

  macos:
    name: Native macOS 26 build and package
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Installed path verified in the official macos-26 arm64 image documentation.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and log native toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          sw_vers
          uname -m
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path
          os_version="$(sw_vers -productVersion)"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          xcode_version="$(xcodebuild -version)"
          [[ "${os_version%%.*}" -ge 26 ]]
          [[ "${sdk_version%%.*}" -ge 26 ]]
          [[ "$xcode_version" == Xcode\ 26.* ]]
      - name: Test
        run: swift test
      - name: Build native product
        run: swift build --product TokenBudget
      - name: Package development app
        run: bash scripts/build-app.sh
      - name: Verify bundle signature and archive
        run: |
          test -d dist/TokenBudget.app
          codesign --verify --deep --strict --verbose=2 dist/TokenBudget.app
          codesign --display --verbose=2 dist/TokenBudget.app
          ditto -c -k --sequesterRsrc --keepParent dist/TokenBudget.app dist/TokenBudget-macos-arm64.zip
      - name: Smoke test packaged process
        run: |
          dist/TokenBudget.app/Contents/MacOS/TokenBudget &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 5
          kill -0 "$app_pid"
      - name: Upload development bundle only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TokenBudget-macos-arm64-${{ github.sha }}
          path: dist/TokenBudget-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          archive: true
