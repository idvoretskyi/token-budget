name: Bug report
description: Report a reproducible problem using synthetic data only.
body:
  - type: markdown
    attributes:
      value: |
        This is a public issue. Do not attach raw logs, session files, databases,
        prompts, credentials, personal paths, or identifying screenshots.
        Report vulnerabilities through SECURITY.md instead.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: App revision, OS, Swift/Xcode if relevant, and source tool version. No environment dumps.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Minimal steps with invented data. Describe settings without personal paths or real identifiers.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe the difference. Static warning text is fine; raw diagnostic output is not.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains only synthetic data and no private files, raw logs, credentials, or identifying details.
          required: true
